configuration:
  repository:
    name: Repository
    description: Private GitHub repository, as USER/REPOSITORY (an https or git@ URL also works). Create it empty.
  auth:
    name: Authentication
    description: github_app = approve a code once (no key or token to store; access renews by itself). ssh = classic deploy key shown in the log.
  github_app_client_id:
    name: GitHub App client ID
    description: Client ID of the GitHub App used for github_app authentication. The default is the public ESPHome Git Push app; install it on your repository first.
  restore_if_empty:
    name: Restore on an empty install
    description: If /config/esphome has no repository and no YAML, clone the repository back (full history) and decrypt secrets.yaml with the secrets password.
  branch:
    name: Branch
    description: Remote branch to push to.
  secrets_password:
    name: Secrets password
    description: Password used to encrypt secrets.yaml into secrets.yaml.gpg (AES256). Keep it in your password manager; without it the file cannot be read. Leave empty to not push secrets.
  interval_minutes:
    name: Safety-net interval (minutes)
    description: How often to commit and push changes made outside the Device Builder (Samba, File editor, packages).
  push_retries:
    name: Push retries
    description: Extra attempts after a failed push before reporting the failure (0 = report on the first failure).
  retry_delay_seconds:
    name: Delay between retries (seconds)
    description: Wait between push attempts.
  notify_on_failure:
    name: Notify devices on failure
    description: After all attempts fail, send the message below to the services listed in Notify services. A persistent notification and an esphome_git_push_failed event are always created.
  notify_services:
    name: Notify services
    description: One action per line, as domain.service, e.g. notify.mobile_app_my_phone or script.my_notify_script (receives title and message). Sent once per failure streak.
  failure_title:
    name: Failure title
    description: Title of the failure notice. Placeholders - {repository}, {attempts}, {error}.
  failure_message:
    name: Failure message
    description: Text of the failure notice. Placeholders - {repository}, {attempts}, {error}.
  approval_title:
    name: Approval title
    description: Title of the notice asking you to approve GitHub access. Placeholders - {code}, {url}, {repository}, {install_url}.
  approval_message:
    name: Approval message
    description: Text of that notice, sent to the persistent notifications and to the Notify services. Placeholders - {code}, {url}, {repository}, {install_url}.
