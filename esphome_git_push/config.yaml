name: ESPHome Git Push
version: "1.1.1"
slug: esphome_git_push
description: Pushes the ESPHome Device Builder git history (/config/esphome) to a private GitHub repository, with secrets.yaml encrypted, and restores it on an empty install.
url: https://github.com/willrnsantana/ha-esphome-git-push
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
homeassistant_api: true
map:
  - type: homeassistant_config
    read_only: false
options:
  repository: ""
  branch: main
  auth: github_app
  github_app_client_id: Iv23liKLQWIKK4ZMEqeJ
  secrets_password: ""
  restore_if_empty: true
  interval_minutes: 60
  push_retries: 3
  retry_delay_seconds: 30
  notify_on_failure: false
  notify_services: []
  failure_title: "ESPHome Git Push: push failed"
  failure_message: "The ESPHome YAML files were not pushed to {repository} after {attempts} attempts. Error: {error}"
  approval_title: "ESPHome Git Push: approve GitHub access"
  approval_message: "Open {url} and enter the code {code} to let ESPHome Git Push access {repository}. The code is valid for 15 minutes. First time? Install the GitHub App on the repository: {install_url}"
schema:
  repository: str?
  branch: str
  auth: list(github_app|ssh)
  github_app_client_id: str
  secrets_password: password?
  restore_if_empty: bool
  interval_minutes: int(10,1440)
  push_retries: int(0,10)
  retry_delay_seconds: int(5,600)
  notify_on_failure: bool
  notify_services:
    - str
  failure_title: str
  failure_message: str
  approval_title: str
  approval_message: str
